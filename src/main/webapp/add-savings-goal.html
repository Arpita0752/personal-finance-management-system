<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Savings Goal - Personal Finance</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>Personal Finance</h2>

    <div>
        <a href="dashboard">Dashboard</a>
        <a href="logout">Logout</a>
    </div>

</div>

<div class="container">

    <div class="form-card">

        <h1>🎯 Set Savings Goal</h1>

        <form action="addSavingsGoal" method="post">

            <label>Goal Name</label>

            <input type="text"
                   name="goalName"
                   placeholder="Example: New Laptop"
                   required>

            <label>Target Amount</label>

            <input type="number"
                   name="targetAmount"
                   min="1"
                   step="0.01"
                   placeholder="Enter target amount"
                   required>

            <label>Target Date</label>

            <input type="date"
                   name="targetDate"
                   required>

            <button type="submit">Set Savings Goal</button>

        </form>

        <a class="back" href="dashboard">← Back to Dashboard</a>

    </div>

</div>

</body>
</html>
