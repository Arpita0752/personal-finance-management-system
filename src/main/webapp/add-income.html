<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Income - Personal Finance</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Personal Finance</h2>

    <div>
        <a href="dashboard">Dashboard</a>
        <a href="logout">Logout</a>
    </div>
</div>

<div class="container">

    <div class="form-card">

        <h1>➕ Add Income</h1>

        <form action="addIncome" method="post">

            <label>Income Source</label>

            <select name="sourceId" required>
                <option value="">Select Source</option>
                <option value="1">Salary</option>
                <option value="2">Freelancing</option>
                <option value="3">Business</option>
                <option value="4">Scholarship</option>
                <option value="5">Other</option>
            </select>

            <label>Amount</label>

            <input type="number"
                   name="amount"
                   min="1"
                   step="0.01"
                   placeholder="Enter amount"
                   required>

            <label>Income Date</label>

            <input type="date"
                   name="incomeDate"
                   required>

            <label>Income Type</label>

            <select name="incomeType" required>
                <option value="">Select Type</option>
                <option value="MONTHLY">Monthly</option>
                <option value="ONE_TIME">One Time</option>
            </select>

            <label>Description</label>

            <textarea name="description"
                      placeholder="Enter description"></textarea>

            <button type="submit">Add Income</button>

        </form>

        <a class="back" href="dashboard">← Back to Dashboard</a>

    </div>

</div>

</body>
</html>
