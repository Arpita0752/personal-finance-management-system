<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Register - Personal Finance</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>📝 Create Account</h1>

        <form action="register" method="post">

            <label>Full Name</label>

            <input type="text"
                   name="fullName"
                   placeholder="Enter full name"
                   required>

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter email"
                   required>

            <label>Mobile</label>

            <input type="text"
                   name="mobile"
                   maxlength="10"
                   placeholder="Enter 10-digit mobile"
                   required>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>

            <label>Date of Birth</label>

            <input type="date"
                   name="dateOfBirth">

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login">

            Already have an account?
            <a href="login.html">Login</a>

        </div>

    </div>

</div>

</body>

</html>
