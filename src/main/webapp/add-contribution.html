<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Contribution - Personal Finance</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f4f6f9; }
        .navbar {
            background: #1f2937; color: white; padding: 18px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .navbar h2 { margin: 0; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; }
        .container { width: 90%; max-width: 650px; margin: 40px auto; }
        .card {
            background: white; padding: 30px; border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 { margin-bottom: 25px; }
        label { display: block; margin-bottom: 7px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; border: 1px solid #d1d5db;
            border-radius: 8px; margin-bottom: 18px; font-size: 15px;
        }
        textarea { height: 90px; resize: vertical; }
        button {
            width: 100%; padding: 13px; border: none; border-radius: 8px;
            background: #f59e0b; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer;
        }
        .back {
            display: block; text-align: center; margin-top: 18px;
            color: #2563eb; text-decoration: none;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h2>Personal Finance</h2>
    <div>
        <a href="dashboard">Dashboard</a>
        <a href="logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="card">

        <h1>💵 Add Goal Contribution</h1>

        <form action="addContribution" method="post">

            <label>Goal</label>
            <select name="goalId" required>
                <option value="">Select Goal</option>
                <option value="1">New Laptop</option>
            </select>

            <label>Amount</label>
            <input type="number" name="amount"
                   min="1" step="0.01"
                   placeholder="Enter contribution amount"
                   required>

            <label>Contribution Date</label>
            <input type="date" name="contributionDate" required>

            <label>Description</label>
            <textarea name="description"
                      placeholder="Enter description"></textarea>

            <button type="submit">Add Contribution</button>

        </form>

        <a class="back" href="dashboard">← Back to Dashboard</a>

    </div>
</div>

</body>
</html>
