<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Expense - Personal Finance</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>Personal Finance</h2>

    <div>
        <a href="dashboard">Dashboard</a>
        <a href="logout">Logout</a>
    </div>

</div>

<div class="container">

    <div class="form-card">

        <h1>➖ Add Expense</h1>

        <form action="addExpense" method="post">

            <label>Expense Category</label>

            <select name="categoryId" required>

                <option value="">Select Category</option>

                <option value="1">Food</option>
                <option value="2">Travel</option>
                <option value="3">Shopping</option>
                <option value="4">Education</option>
                <option value="5">Rent</option>
                <option value="6">Bills</option>
                <option value="7">Healthcare</option>
                <option value="8">Entertainment</option>
                <option value="9">Subscriptions</option>
                <option value="10">Others</option>

            </select>

            <label>Payment Method</label>

            <select name="paymentMethodId" required>

                <option value="">Select Payment Method</option>

                <option value="1">Cash</option>
                <option value="2">UPI</option>
                <option value="3">Debit Card</option>
                <option value="4">Credit Card</option>
                <option value="5">Bank Transfer</option>

            </select>

            <label>Amount</label>

            <input type="number"
                   name="amount"
                   min="1"
                   step="0.01"
                   placeholder="Enter amount"
                   required>

            <label>Expense Date</label>

            <input type="date"
                   name="expenseDate"
                   required>

            <label>Description</label>

            <textarea name="description"
                      placeholder="Enter description"></textarea>

            <button type="submit">Add Expense</button>

        </form>

        <a class="back" href="dashboard">← Back to Dashboard</a>

    </div>

</div>

</body>
</html>
