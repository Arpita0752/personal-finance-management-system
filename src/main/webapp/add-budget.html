<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Set Budget - Personal Finance</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>Personal Finance</h2>

    <div>
        <a href="dashboard">Dashboard</a>
        <a href="logout">Logout</a>
    </div>

</div>

<div class="container">

    <div class="form-card">

        <h1>💰 Set Budget</h1>

        <form action="addBudget" method="post">

            <label>Budget Type</label>

            <select name="categoryId">

                <option value="">Overall Budget</option>

                <option value="1">Food</option>
                <option value="2">Travel</option>
                <option value="3">Shopping</option>
                <option value="4">Education</option>
                <option value="5">Rent</option>
                <option value="6">Bills</option>
                <option value="7">Healthcare</option>
                <option value="8">Entertainment</option>
                <option value="9">Subscriptions</option>
                <option value="10">Others</option>

            </select>

            <label>Budget Amount</label>

            <input type="number"
                   name="amount"
                   min="1"
                   step="0.01"
                   placeholder="Enter budget amount"
                   required>

            <label>Month</label>

            <select name="month" required>

                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>

            </select>

            <label>Year</label>

            <input type="number"
                   name="year"
                   value="2026"
                   min="2026"
                   required>

            <button type="submit">Set Budget</button>

        </form>

        <a class="back" href="dashboard">← Back to Dashboard</a>

    </div>

</div>

</body>
</html>
